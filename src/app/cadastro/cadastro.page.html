<ion-content class="cadastro-content">

  <div class="cadastro-box">

    <h1>Criar Conta</h1>
    <p>Cadastre-se para acessar as notícias</p>

    <ion-item>
      <ion-input
        [(ngModel)]="nome"
        placeholder="Nome de usuário">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="email"
        [(ngModel)]="email"
        placeholder="E-mail">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="password"
        [(ngModel)]="senha"
        placeholder="Senha">
      </ion-input>
    </ion-item>

    <ion-button expand="block" (click)="cadastrar()">
      Criar Conta
    </ion-button>

    <ion-button
      expand="block"
      fill="outline"
      routerLink="/home">
      Voltar
    </ion-button>

  </div>

</ion-content>
